name: sol-format-diagnostic

on:
  push:
    branches: [agent/sol-format-diagnostic-20261022]

permissions:
  contents: read

jobs:
  format-and-reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e3f0eb2eb5dfb640aaf2d7d39d7a5b35b4ffe3dd
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic-input
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare bounded synthetic Calendar time probe
        shell: bash
        env:
          DIAGNOSTIC_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e3f0eb2eb5dfb640aaf2d7d39d7a5b35b4ffe3dd
          test "$(pnpm exec prettier --version)" = 3.9.5
          mkdir -p output/calendar-time-probe
          printf '%s\n' "$DIAGNOSTIC_COMMIT" > output/calendar-time-probe/diagnostic-commit.txt
          git rev-parse HEAD > output/calendar-time-probe/input-commit.txt
          cp diagnostic-input/scripts/calendar-provider-time-probe.test.mjs scripts/
          cp diagnostic-input/scripts/calendar-provider-time-probe-report.mjs scripts/
          pnpm exec prettier --write scripts/calendar-provider-time-probe.test.mjs scripts/calendar-provider-time-probe-report.mjs
          pnpm exec prettier --check scripts/calendar-provider-time-probe.test.mjs scripts/calendar-provider-time-probe-report.mjs
          cp scripts/calendar-provider-time-probe.test.mjs scripts/calendar-provider-time-probe-report.mjs output/calendar-time-probe/
          sha256sum scripts/calendar-provider-time-probe.test.mjs > output/calendar-time-probe/harness.sha256

      - name: Compile canonical browser payload without any provider
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @beauessence/domain build
          pnpm run sync:domain
          git diff --exit-code -- packages/domain/src apps/web/public/vendor/domain

      - name: Reproduce malformed inputs while preserving valid offsets
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run scripts/calendar-provider-time-probe.test.mjs --exclude 'diagnostic-input/**' --reporter=verbose --reporter=json --outputFile.json=output/calendar-time-probe/result.json 2>&1 | tee output/calendar-time-probe/unit.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          node scripts/calendar-provider-time-probe-report.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: sol-calendar-time-probe-${{ github.sha }}
          path: output/calendar-time-probe/
          if-no-files-found: error
          retention-days: 7
