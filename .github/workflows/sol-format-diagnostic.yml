name: sol-format-diagnostic

on:
  push:
    branches: [agent/sol-format-diagnostic-20261022]

permissions:
  contents: read

jobs:
  format-and-reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2e9b5ac51897fc67f252f347f58817e17a97e88f
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic-input
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare browser dependencies
        timeout-minutes: 1
        run: node scripts/prepare-ci-apt.mjs

      - name: Install the exact browser engines
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Observe native datetime parsing without application or provider
        run: node diagnostic-input/scripts/calendar-native-date-probe.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: sol-calendar-time-probe-${{ github.sha }}
          path: output/calendar-time-probe/
          if-no-files-found: error
          retention-days: 7
