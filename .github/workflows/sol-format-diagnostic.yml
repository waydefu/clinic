name: SOL format producer

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA whose capture spec needs canonical formatting
        required: true
        type: string

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Record exact source and input hash
        run: |
          mkdir -p output/format-producer
          git rev-parse HEAD > output/format-producer/source-revision.txt
          sha256sum tests/ui-screenshots/current-ui.spec.ts > output/format-producer/input.sha256

      - name: Format only the capture spec
        run: pnpm exec prettier --write tests/ui-screenshots/current-ui.spec.ts

      - name: Save formatted source and hash
        run: |
          cp tests/ui-screenshots/current-ui.spec.ts output/format-producer/current-ui.spec.ts
          sha256sum output/format-producer/current-ui.spec.ts > output/format-producer/formatted.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sol-visual-format-${{ inputs.source_sha }}
          path: output/format-producer/
          if-no-files-found: error
          retention-days: 90
