name: sol-format-diagnostic

on:
  push:
    branches: [agent/sol-format-diagnostic-20261022]

permissions:
  contents: read

jobs:
  format-and-reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cf62a1c53e5dcf14ebc4aae633a7488e792f641d
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic-input
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare browser dependencies
        timeout-minutes: 1
        run: node scripts/prepare-ci-apt.mjs

      - name: Install the exact browser engines
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Format and bind the pinned source and unchanged harness
        shell: bash
        env:
          DIAGNOSTIC_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cf62a1c53e5dcf14ebc4aae633a7488e792f641d
          test "$(pnpm exec prettier --version)" = 3.9.5
          mkdir -p output/calendar-time-probe/green output/calendar-time-probe/red
          printf '%s\n' "$DIAGNOSTIC_COMMIT" > output/calendar-time-probe/diagnostic-commit.txt
          git rev-parse HEAD > output/calendar-time-probe/input-commit.txt
          cp diagnostic-input/scripts/calendar-budget-report.mjs diagnostic-input/scripts/calendar-provider-time-probe-report.mjs scripts/
          pnpm exec prettier --write scripts/calendar-time-admission-parity.test.mjs packages/domain/src/timestamp.ts packages/domain/src/calendar-sync.ts packages/domain/src/calendar-projection.ts apps/worker/src/pilot/pilot-sanitizer.ts tests/e2e/clinic-site.spec.ts
          pnpm exec prettier --check scripts/calendar-time-admission-parity.test.mjs packages/domain/src/timestamp.ts packages/domain/src/calendar-sync.ts packages/domain/src/calendar-projection.ts apps/worker/src/pilot/pilot-sanitizer.ts tests/e2e/clinic-site.spec.ts
          git diff --binary -- scripts/calendar-time-admission-parity.test.mjs packages/domain/src/timestamp.ts packages/domain/src/calendar-sync.ts packages/domain/src/calendar-projection.ts apps/worker/src/pilot/pilot-sanitizer.ts tests/e2e/clinic-site.spec.ts > output/calendar-time-probe/format.patch
          cp scripts/calendar-time-admission-parity.test.mjs packages/domain/src/timestamp.ts packages/domain/src/calendar-sync.ts packages/domain/src/calendar-projection.ts apps/worker/src/pilot/pilot-sanitizer.ts tests/e2e/clinic-site.spec.ts output/calendar-time-probe/
          for mode in green red; do
            cp scripts/calendar-time-admission-parity.test.mjs output/calendar-time-probe/$mode/
            cp output/calendar-time-probe/diagnostic-commit.txt output/calendar-time-probe/$mode/
          done
          cp output/calendar-time-probe/input-commit.txt output/calendar-time-probe/green/
          printf '%s\n' e3f0eb2eb5dfb640aaf2d7d39d7a5b35b4ffe3dd > output/calendar-time-probe/red/input-commit.txt

      - name: Compile vendor and verify unit, budget and native browser
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @beauessence/domain build
          pnpm run sync:domain
          git diff --binary -- apps/web/public/vendor/domain > output/calendar-time-probe/vendor.patch
          cp -R apps/web/public/vendor/domain output/calendar-time-probe/vendor-domain
          pnpm exec vitest run scripts/calendar-time-admission-parity.test.mjs --exclude 'diagnostic-input/**' --reporter=verbose --reporter=json --outputFile.json=output/calendar-time-probe/green/result.json 2>&1 | tee output/calendar-time-probe/green/unit.log
          node scripts/calendar-provider-time-probe-report.mjs output/calendar-time-probe/green green cf62a1c53e5dcf14ebc4aae633a7488e792f641d
          pnpm run build:web
          cp -R apps/web/dist output/calendar-time-probe/dist
          set +e
          node scripts/check-performance-budget.mjs --report 2>&1 | tee output/calendar-time-probe/performance-budget.log
          budget=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$budget" > output/calendar-time-probe/budget-exit.txt
          node scripts/calendar-budget-report.mjs
          pnpm exec playwright test tests/e2e/clinic-site.spec.ts --project=chromium --project=webkit --grep '預約入口載入的雜湊模組在瀏覽器拒絕非 UTC 時間' --reporter=list 2>&1 | tee output/calendar-time-probe/native-browser.log

      - name: Reproduce the identical harness on original source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin e3f0eb2eb5dfb640aaf2d7d39d7a5b35b4ffe3dd
          for file in packages/domain/src/timestamp.ts packages/domain/src/calendar-sync.ts packages/domain/src/calendar-projection.ts apps/worker/src/pilot/pilot-sanitizer.ts; do
            git show "e3f0eb2eb5dfb640aaf2d7d39d7a5b35b4ffe3dd:$file" > "$file"
          done
          pnpm --filter @beauessence/domain build
          pnpm run sync:domain
          set +e
          pnpm exec vitest run scripts/calendar-time-admission-parity.test.mjs --exclude 'diagnostic-input/**' --reporter=verbose --reporter=json --outputFile.json=output/calendar-time-probe/red/result.json 2>&1 | tee output/calendar-time-probe/red/unit.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          node scripts/calendar-provider-time-probe-report.mjs output/calendar-time-probe/red red e3f0eb2eb5dfb640aaf2d7d39d7a5b35b4ffe3dd

      - name: Enforce the unchanged performance budget result
        shell: bash
        run: |
          read -r budget < output/calendar-time-probe/budget-exit.txt
          test "$budget" -eq 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: sol-calendar-time-probe-${{ github.sha }}
          path: output/calendar-time-probe/
          if-no-files-found: error
          retention-days: 7
