name: codeql

# 靜態應用程式安全測試（SAST）。ESLint 擋的是單一檔案裡一眼可辨的注入 sink；
# CodeQL 做的是跨檔案的資料流／污染追蹤——例如「使用者輸入是否在沒有經過
# escapeHtml 的情況下流進 innerHTML」。這個平台的瀏覽器層大量使用樣板字串產生
# HTML，正是這類分析最有價值的地方。
#
# Repository 已經在 GitHub；私有 repository 是否能上傳 code-scanning 結果仍
# 取決於 repository 方案／GitHub Advanced Security 權限。YAML 存在不是成功證據，
# 上線證據必須附實際 run、綁定 commit 的 artifact 與 code-scanning 結果。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每週一 03:00 UTC 重掃：新的查詢規則會發現舊程式碼裡既有的問題，
    # 只在 push 時掃會漏掉這一類。
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL（JavaScript／TypeScript 資料流分析）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # 上傳掃描結果到 repository 的 Security 分頁。
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: javascript-typescript
          # security-extended 比預設多涵蓋較低信心但仍值得看的查詢；
          # 這個專案處理個資，寧可多看幾筆也不要漏。
          queries: security-extended

      # 這個 workspace 沒有需要編譯才能分析的語言，JS/TS 走 CodeQL 的
      # 自動建模即可，不必安裝相依。
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        id: codeql-analyze
        with:
          category: '/language:javascript-typescript'

      - name: Generate commit-bound CodeQL evidence
        if: ${{ always() }}
        env:
          CODEQL_ANALYZE_OUTCOME: ${{ steps.codeql-analyze.outcome }}
        run: node scripts/generate-codeql-evidence.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: codeql-verification-evidence
          path: |
            output/evidence/codeql-verification.json
            output/evidence/codeql-verification.md
          if-no-files-found: error
          retention-days: 90
