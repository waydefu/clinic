name: sast

# 掃描的實作在 `.github/workflows/sast-scan.yml`，那裡也放著 Semgrep CE 的政策
# 說明。這個 workflow 只是它的排程／手動觸發包裝。
#
# 為什麼要拆：GitHub Actions 的 `needs` 不跨 workflow。SAST 只存在於這個獨立
# workflow 時，`main` 唯一 required 的 `Verification evidence` 拿不到它的結果，
# 紅的 SAST 因此擋不住合併——那就是 `SCM-R01` 關掉的缺口。**會阻斷合併的那一次
# 執行現在發生在 `verify.yml` 裡**，它以同一份可重用 workflow 在同一個 run 內掃
# 同一個候選 commit。
#
# 這個檔案因此刻意**不再監聽 push 與 pull_request**：同一個 commit 掃兩次不會多
# 證明任何事，卻會在 PR 上並排出現兩個看似可互相取代、實際只有一個被 required
# 證據消費的結果。留下的是 `verify.yml` 不涵蓋的兩種觸發。
on:
  schedule:
    # Re-run weekly so scanner/rule changes are reviewed deliberately instead
    # of arriving through an unpinned registry alias.
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    uses: ./.github/workflows/sast-scan.yml
