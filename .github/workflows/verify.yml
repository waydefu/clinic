name: verify

# 專案規約要求「Pull Request 必須通過檢查」，在此之前那句話沒有強制力：
# 所有檢查都靠人工在本機執行。這個 workflow 就是那句話的執行者。
#
# 每個 action 都釘 **commit SHA**，旁邊註記人看得懂的版本。tag 是可以被移動的
# ——上游帳號被盜或維護者改指 tag，用 `@v4` 的 workflow 下一次執行就會跑到不同的
# 程式碼，而這些 job 拿得到 repository 內容。SHA 不能被改指。
#
# 更新方式：改 SHA 並同步旁邊的版本註記，不要只改註記。annotated tag 要解參考到
# **commit**（`git/tags/<sha>` 再取 object.sha），直接用 `git/ref/tags/<tag>` 拿到的
# 可能是 tag 物件的 SHA，那個 Actions 不接受。pnpm/action-setup 與
# github/codeql-action 就是 annotated tag。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 結構、文件、格式、lint、型別與單元測試
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 與 package.json 的 engines 一致。
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  rules:
    name: Firestore Emulator（交易、冪等、outbox、預設拒絕）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # Firestore Emulator 需要 JVM。
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages used by Firestore tests
        run: pnpm --filter @beauessence/contracts --filter @beauessence/domain run build

      # 這個工作只使用本機 Emulator 與拋棄式的假 project ID，
      # 不會接觸任何雲端 Firebase 專案，也不需要任何憑證。
      - run: pnpm test:rules

  e2e:
    name: Playwright E2E 與 axe 無障礙（跑在打包產物上）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 只裝這個工作需要的 Chromium 與其系統相依。
      - run: pnpm exec playwright install --with-deps chromium

      # playwright.config 的 webServer 會先 build（含 content-hash 的 dist）再
      # 以 WEB_ROOT=dist 啟動 server.mjs，因此 E2E 跑的是實際會部署的產物。
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  supply-chain:
    name: Tracked secrets、dependency audit 與 inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tracked secrets, high/critical advisories, and the CycloneDX 1.6 SBOM
      # with its licence policy gate. Copyleft and unrecognised licences fail
      # here; the reviewed exceptions are printed on every run so they cannot
      # quietly become permanent. Moderate advisories remain visible and need an
      # owner before the production policy is final.
      - run: pnpm check:supply-chain

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  evidence:
    name: Verification evidence
    if: ${{ always() }}
    needs: [verify, rules, e2e, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The final gate binds every required result to the exact commit and run.
      # It writes the evidence even when an upstream job fails, then fails this
      # job so branch protection can use one stable required check.
      - name: Generate commit-bound verification evidence
        env:
          CI_EVIDENCE_VERIFY_RESULT: ${{ needs.verify.result }}
          CI_EVIDENCE_RULES_RESULT: ${{ needs.rules.result }}
          CI_EVIDENCE_E2E_RESULT: ${{ needs.e2e.result }}
          CI_EVIDENCE_SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
        run: node scripts/generate-ci-evidence.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: verification-evidence
          path: |
            output/evidence/ci-verification.json
            output/evidence/ci-verification.md
          if-no-files-found: error
          retention-days: 90
