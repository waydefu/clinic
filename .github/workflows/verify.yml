name: verify

# 專案規約要求「Pull Request 必須通過檢查」，在此之前那句話沒有強制力：
# 所有檢查都靠人工在本機執行。這個 workflow 就是那句話的執行者。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 結構、文件、格式、lint、型別與單元測試
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 與 package.json 的 engines 一致。
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  rules:
    name: Firestore Emulator（交易、冪等、outbox、預設拒絕）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Firestore Emulator 需要 JVM。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      # 這個工作只使用本機 Emulator 與拋棄式的假 project ID，
      # 不會接觸任何雲端 Firebase 專案，也不需要任何憑證。
      - run: pnpm test:rules

  e2e:
    name: Playwright E2E 與 axe 無障礙（跑在打包產物上）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 只裝這個工作需要的 Chromium 與其系統相依。
      - run: pnpm exec playwright install --with-deps chromium

      # playwright.config 的 webServer 會先 build（含 content-hash 的 dist）再
      # 以 WEB_ROOT=dist 啟動 server.mjs，因此 E2E 跑的是實際會部署的產物。
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  supply-chain:
    name: Tracked secrets、dependency audit 與 inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tracked secrets, high/critical advisories, and the CycloneDX 1.6 SBOM
      # with its licence policy gate. Copyleft and unrecognised licences fail
      # here; the reviewed exceptions are printed on every run so they cannot
      # quietly become permanent. Moderate advisories remain visible and need an
      # owner before the production policy is final.
      - run: pnpm check:supply-chain

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
