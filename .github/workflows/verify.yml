name: verify

# 專案規約要求「Pull Request 必須通過檢查」，在此之前那句話沒有強制力：
# 所有檢查都靠人工在本機執行。這個 workflow 就是那句話的執行者。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 結構、文件、格式、lint、型別與單元測試
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 與 package.json 的 engines 一致。
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  rules:
    name: Firestore Emulator（交易、冪等、outbox、預設拒絕）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Firestore Emulator 需要 JVM。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      # 這個工作只使用本機 Emulator 與拋棄式的假 project ID，
      # 不會接觸任何雲端 Firebase 專案，也不需要任何憑證。
      - run: pnpm test:rules
