name: verify

# 專案規約要求「Pull Request 必須通過檢查」，在此之前那句話沒有強制力：
# 所有檢查都靠人工在本機執行。這個 workflow 就是那句話的執行者。
#
# 每個 action 都釘 **commit SHA**，旁邊註記人看得懂的版本。tag 是可以被移動的
# ——上游帳號被盜或維護者改指 tag，用 `@v4` 的 workflow 下一次執行就會跑到不同的
# 程式碼，而這些 job 拿得到 repository 內容。SHA 不能被改指。
#
# 更新方式：改 SHA 並同步旁邊的版本註記，不要只改註記。annotated tag 要解參考到
# **commit**（`git/tags/<sha>` 再取 object.sha），直接用 `git/ref/tags/<tag>` 拿到的
# 可能是 tag 物件的 SHA，那個 Actions 不接受。pnpm/action-setup 與
# github/codeql-action 就是 annotated tag。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      capture_ui:
        description: Generate the dated UI reference artifact on a Linux runner
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 一次性的 owner acceptance evidence 路徑。正常 PR verify 不執行；final C3 前
  # 會移除本段，使 workflow 回到 main 的 frozen 版本。
  capture-ui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_ui }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm capture:ui

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-visual-baseline-2026-08-22
          path: docs/reviews/assets/ui-visual-baseline-2026-08-22/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: 結構、文件、格式、lint、型別與單元測試
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 與 package.json 的 engines 一致。
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  rules:
    name: Firestore Emulator（交易、冪等、outbox、預設拒絕）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Firestore Emulator 需要 JVM。
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages used by Firestore tests
        run: pnpm --filter @beauessence/contracts --filter @beauessence/domain run build

      # 這個工作只使用本機 Emulator 與拋棄式的假 project ID，
      # 不會接觸任何雲端 Firebase 專案，也不需要任何憑證。
      - run: pnpm test:rules

  # E2E 依「壞掉的時候你會想找誰」拆成數組平行執行，PR 上因此看到的是
  # `e2e-auth-rbac`、`e2e-mobile` 這種名字，而不是一個要等二十分鐘才知道
  # 是什麼壞掉的 `e2e`。
  #
  # 兩個組態決定了這次拆分有沒有意義，改動前請先讀懂：
  #
  # `fail-fast: false` — 預設的 true 會在第一組失敗時取消其餘各組，於是又回到
  # 「只知道有東西壞了」的狀態。拆開的唯一理由就是要一次看完所有組的結果。
  #
  # artifact 名稱帶上組名 — upload-artifact v4 不允許同名 artifact，六組共用
  # `playwright-report` 會讓後完成的組上傳失敗。
  #
  # 哪些 spec 屬於哪一組定義在 scripts/e2e-groups.mjs，不在這裡；`pnpm verify`
  # 的 check:e2e-groups 會驗證下面這串組名與那份清單一致，且沒有任何 spec 沒被
  # 分到組。少跑的測試看起來和通過一模一樣，所以那個 gate 是這次拆分的前提。
  e2e:
    name: e2e-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group:
          - auth-rbac
          - appointments
          - patient-portal
          - mobile
          - accessibility
          - ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 只裝這個工作需要的瀏覽器與其系統相依。
      #
      # WebKit 只有 patient-portal 這一組用得到——playwright.config.ts 的
      # webkit project 把 testMatch 收在 clinic-site.spec.ts，而那支屬於這一組。
      # 其餘四組不下載它（約 59 MB ＋ 系統相依），六組都裝等於為了兩分鐘的
      # 引擎覆蓋付六份下載。
      - run: pnpm exec playwright install --with-deps chromium ${{ matrix.group == 'patient-portal' && 'webkit' || '' }}

      # playwright.config 的 webServer 會先 build（含 content-hash 的 dist）再
      # 以 WEB_ROOT=dist 啟動 server.mjs，因此 E2E 跑的是實際會部署的產物。
      # 每一組都是獨立的 runner，所以各自 build 一次；這是換取「知道是哪一組壞掉」
      # 的代價。
      - name: Playwright E2E（${{ matrix.group }}）
        run: pnpm test:e2e $(node scripts/e2e-groups.mjs --files ${{ matrix.group }})

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.group }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  supply-chain:
    name: Tracked secrets、dependency audit 與 inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tracked secrets, high/critical advisories, and the CycloneDX 1.6 SBOM
      # with its licence policy gate. Copyleft and unrecognised licences fail
      # here; the reviewed exceptions are printed on every run so they cannot
      # quietly become permanent. Moderate advisories remain visible and need an
      # owner before the production policy is final.
      - run: pnpm check:supply-chain

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  # SCM-R01：SAST 必須和其他必要 job 在**同一個 run** 內執行，`needs` 才拿得到它的
  # 結果——GitHub Actions 沒有跨 workflow 的 `needs`。掃描實作因此抽成可重用
  # workflow，由這裡呼叫；`sast.yml` 用同一份實作跑每週排程與手動觸發，Semgrep 的
  # 定義只有一份。
  #
  # 同 commit 由呼叫方式保證，不是靠約定：`./` 開頭的 reusable workflow 一定取自
  # 呼叫端所在的 commit，被呼叫 workflow 內的 `github.sha` 就是這個 run 的候選
  # commit。沒有分支頭替換、沒有「最近一次成功的 SAST」查詢，也就沒有舊結果冒充新
  # commit 的競態。
  #
  # PR 上仍看得到獨立的 SAST 結果，名稱是 `sast / Semgrep CE SAST（可稽核、會阻斷）`，
  # artifact 與 SARIF/JSON 證據照舊。
  sast:
    uses: ./.github/workflows/sast-scan.yml

  evidence:
    name: Verification evidence
    if: ${{ always() }}
    # `e2e` 是 matrix job，`needs.e2e.result` 會**彙總**全部組別：任何一組不是
    # success，這裡拿到的就不是 success。`sast` 是呼叫可重用 workflow 的 job，
    # `needs.sast.result` 同樣是被呼叫 workflow 的整體結論。因此不論拆成幾組或幾層，
    # 證據的判斷不變，branch protection 也仍然只綁 `Verification evidence` 這一個
    # check。要看是哪一組壞掉，看 PR 上的 `e2e-<group>` 或 `sast / …`。
    #
    # required job 清單自 `SCM-R01` 起是五項——第五項是 `sast`。
    needs: [verify, rules, e2e, supply-chain, sast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The final gate binds every required result to the exact commit and run.
      # It writes the evidence even when an upstream job fails, then fails this
      # job so branch protection can use one stable required check.
      - name: Generate commit-bound verification evidence
        env:
          CI_EVIDENCE_VERIFY_RESULT: ${{ needs.verify.result }}
          CI_EVIDENCE_RULES_RESULT: ${{ needs.rules.result }}
          CI_EVIDENCE_E2E_RESULT: ${{ needs.e2e.result }}
          CI_EVIDENCE_SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          CI_EVIDENCE_SAST_RESULT: ${{ needs.sast.result }}
          # 掃描自報的 commit。它必須等於這個 run 的候選 commit，證據才算同 commit。
          # 失敗的掃描同樣會回報它掃了誰，所以紅燈指名得出對象；真正拿不到值的情況
          # （被跳過、提早中斷）是空字串，而空字串判為不符。
          CI_EVIDENCE_SAST_COMMIT: ${{ needs.sast.outputs.commit }}
        run: node scripts/generate-ci-evidence.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: verification-evidence
          path: |
            output/evidence/ci-verification.json
            output/evidence/ci-verification.md
          if-no-files-found: error
          retention-days: 90
