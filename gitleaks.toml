# gitleaks 設定。公開鏡像的發布關卡要求對完整 Git 歷史執行 gitleaks，因此這份
# 設定是那道關卡的一部分，不是本機方便用的旁枝。
#
# 原則：**只允許具名、能解釋、有形狀的例外**。不使用路徑層級的整檔豁免——那會讓
# 該檔案日後真的混進金鑰時完全不會被發現。這裡只比對具名的值樣式或錨定整行樣式，
# 不忽略路徑；真正的 AWS／GitHub／Google 憑證不符合這些例外。
# vendor domain manifest 的比對改看整行：檔名是公開 JS、值是精確 64 字元
# lowercase hex（sha256），不是憑證。

[extend]
useDefault = true

[[allowlists]]
description = """
單元測試裡的合成識別碼。gitleaks 的 generic-api-key 規則會對任何名稱含 key 的
指派值告警，而本專案的契約測試大量使用冪等鍵——它們是測試資料，不是憑證：

  packages/contracts/src/payroll.test.ts   payroll-close-key-NNNN
  packages/contracts/src/schedule.test.ts  schedule_publish_NNNN
  apps/api occupancy HTTP emulator history schedule_publish_occupancy_NNNN
  apps/api internal-test emulator history  booking-idempotency-NNNN,
  arrive-idempotency-NNNN, complete-idempotency-NNNN,
  follow-up-idempotency-NNNN
  apps/web/src/business-view.test.ts export request body:
    one complete body line with idempotencyKey synthetic_key_<10 digits>
    and format csv; the anchored expression rejects any extra token on that line
  scripts/stage-f-synthetic-schedule-bootstrap.mjs
    stagef_c1_schedule_publish_v0
    (inspect-only Stage F publish idempotency id; not a credential)

這些是具名且可回溯至測試來源的合成固定形狀。匯出測試的例外要求完整 body 行符合
固定請求形狀；若該行多出任何 token，例外就不會命中。若日後測試改用別的前綴或
請求形狀，這裡必須一起更新——allowlist 沒有涵蓋到的新值會照常告警，那是刻意的。

另：`apps/web/public/vendor/domain/manifest.json` 把公開 domain JS 對到 sha256。
generic-api-key 會把檔名含 auth 的那一列當成金鑰。允許的形狀是
`<vendor-js>": "<64 lowercase hex>"`。AWS／GitHub／Google 憑證不是這個形狀。
"""
regexTarget = "secret"
regexes = [
  '''^payroll-close-key-\d{4}$''',
  '''^schedule_publish_\d{4}$''',
  '''^schedule_publish_occupancy_\d{4}$''',
  '''^schedule-publish-key-\d{4}$''',
  '''^booking-idempotency-\d{4}$''',
  '''^arrive-idempotency-\d{4}$''',
  '''^complete-idempotency-\d{4}$''',
  '''^follow-up-idempotency-\d{4}$''',
  '''^stagef_c1_schedule_publish_v0$'''
]

[[allowlists]]
description = """
Only the complete synthetic export body, one vendor digest row, or the following
five complete C1 host line forms. #268 specifies the only approved host:
beauessence-clinic-stg-c1a01.web.app is a public domain, not a credential.

C1 branches (all anchored, horizontal whitespace only, no extra trailing token):
1. infra/terraform/c1-internal-test-run/noop.tftest.hcl:
   firebase_auth_domain = "exact host" (double quotes, no comma).
2. apps/api/src/auth/calendar-pilot-session.test.ts:
   authDomain: 'exact host', (single quotes and the existing comma).
3. infra/terraform/c1-internal-test-run/noop.tftest.hcl:
   condition = var.firebase_auth_domain == "exact host" (no suffix).
4. infra/terraform/c1-internal-test-run/variables.tf:373:
   var.firebase_auth_domain == "exact host" && (only this literal && suffix).
5. scripts/terraform-sha-gate.test.mjs:
   '-var=firebase_auth_domain=exact host' (single-quoted flag, no comma).

These finite forms are the #268 Claude clarification, not a path exemption.
Any additional token, scheme, path, host prefix/suffix or subdomain is refused.
"""
regexTarget = "line"
regexes = [
  '''^\s*body: \{ idempotencyKey: 'synthetic[_]key_\d{10}', format: 'csv' \},\s*$''',
  '''^\s*"[A-Za-z0-9.-]+\.js": "[a-f0-9]{64}",?\s*$''',
  '''^[ \t]*firebase_auth_domain[ \t]*=[ \t]*"beauessence-clinic-stg-c1a01\.web\.app"[ \t]*$''',
  '''^[ \t]*authDomain:[ \t]*'beauessence-clinic-stg-c1a01\.web\.app',[ \t]*$''',
  '''^[ \t]*condition[ \t]*=[ \t]*var\.firebase_auth_domain[ \t]*==[ \t]*"beauessence-clinic-stg-c1a01\.web\.app"[ \t]*$''',
  '''^[ \t]*var\.firebase_auth_domain[ \t]*==[ \t]*"beauessence-clinic-stg-c1a01\.web\.app"[ \t]+&&[ \t]*$''',
  '''^[ \t]*'-var=firebase_auth_domain=beauessence-clinic-stg-c1a01\.web\.app'[ \t]*$'''
]
