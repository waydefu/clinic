<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1230" viewBox="0 0 1280 1230" role="img" aria-labelledby="title desc"><title id="title">Clinic 六個版型概念</title><desc id="desc">官網、患者預約、工作臺各兩個方案。左欄為本次實作方向，右欄為未實作備選。</desc><rect width="1280" height="1230" fill="#f5f6f3"/><g font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" fill="#182e27"><text x="40" y="52" font-size="28">CLINIC / 三種使用情境，六個設計方向</text><text x="40" y="86" font-size="17">概念草圖 · 2026-09-07 · 左：實作方向　右：備選 · 示意內容不代表新增功能</text><rect x="40" y="120" width="580" height="328" rx="8" fill="#fff" stroke="#dbe7df"/><text x="60" y="154" font-size="21" fill="#182e27">01 A 森林與紙感 / 醫師信任</text><rect x="60" y="172" width="540" height="32" rx="3" fill="#eaf0e6" stroke="#dbe7df"/><text x="72" y="195" font-size="14" fill="#182e27">品牌與導覽                                      主要入口</text><text x="70" y="247" font-size="27" fill="#182e27">先了解困擾</text><text x="70" y="284" font-size="20" fill="#182e27">再一起找到照護方向</text><rect x="370" y="220" width="210" height="150" rx="8" fill="#eaf0e6" stroke="#dbe7df"/><text x="401" y="302" font-size="17" fill="#182e27">既有醫師肖像</text><rect x="70" y="310" width="140" height="42" rx="8" fill="#184f40" stroke="#dbe7df"/><text x="87" y="338" font-size="17" fill="#fff">線上預約</text><text x="70" y="410" font-size="16" fill="#182e27">優點：可信、清楚　代價：敘事較克制</text><rect x="660" y="120" width="580" height="328" rx="8" fill="#fff" stroke="#dbe7df"/><text x="680" y="154" font-size="21" fill="#182e27">01 B 編輯式 / 症狀索引</text><rect x="680" y="172" width="540" height="32" rx="3" fill="#eaf0e6" stroke="#dbe7df"/><text x="692" y="195" font-size="14" fill="#182e27">品牌與導覽                                      主要入口</text><text x="690" y="248" font-size="27" fill="#182e27">從症狀開始了解</text><rect x="690" y="278" width="160" height="90" rx="8" fill="#f8f7f2" stroke="#dbe7df"/><text x="734" y="333" font-size="21" fill="#182e27">鼻塞</text><rect x="864" y="278" width="160" height="90" rx="8" fill="#f8f7f2" stroke="#dbe7df"/><text x="908" y="333" font-size="21" fill="#182e27">打鼾</text><rect x="1038" y="278" width="160" height="90" rx="8" fill="#f8f7f2" stroke="#dbe7df"/><text x="1082" y="333" font-size="21" fill="#182e27">睡眠</text><text x="690" y="410" font-size="16" fill="#182e27">優點：快速探索　代價：醫師信任需往下讀</text><rect x="40" y="475" width="580" height="328" rx="8" fill="#fff" stroke="#dbe7df"/><text x="60" y="509" font-size="21" fill="#182e27">02 A 聚焦步驟 / 逐段完成</text><rect x="60" y="527" width="540" height="32" rx="3" fill="#eaf0e6" stroke="#dbe7df"/><text x="72" y="550" font-size="14" fill="#182e27">品牌與導覽                                      主要入口</text><text x="105" y="596" font-size="17" fill="#182e27">① 類型與項目 → ② 日期時段 → ③ 基本資料</text><rect x="125" y="620" width="410" height="103" rx="8" fill="#f8f7f2" stroke="#dbe7df"/><text x="148" y="657" font-size="22" fill="#182e27">這次是初診還是回診？</text><rect x="147" y="674" width="150" height="34" rx="8" fill="#eaf0e6" stroke="#dbe7df"/><text x="198" y="697" font-size="17" fill="#182e27">初診</text><text x="70" y="765" font-size="16" fill="#182e27">優點：手機好專注　代價：跨步資訊分段</text><rect x="660" y="475" width="580" height="328" rx="8" fill="#fff" stroke="#dbe7df"/><text x="680" y="509" font-size="21" fill="#182e27">02 B 雙欄摘要 / 資料並讀</text><rect x="680" y="527" width="540" height="32" rx="3" fill="#eaf0e6" stroke="#dbe7df"/><text x="692" y="550" font-size="14" fill="#182e27">品牌與導覽                                      主要入口</text><rect x="690" y="584" width="330" height="148" rx="8" fill="#f8f7f2" stroke="#dbe7df"/><text x="710" y="618" font-size="21" fill="#182e27">日期與聯絡資料</text><text x="710" y="665" font-size="17" fill="#182e27">欄位與行內錯誤</text><rect x="1035" y="584" width="165" height="148" rx="8" fill="#eaf0e6" stroke="#dbe7df"/><text x="1055" y="618" font-size="21" fill="#182e27">預約摘要</text><text x="1055" y="665" font-size="17" fill="#182e27">類型 / 時段</text><text x="690" y="765" font-size="16" fill="#182e27">優點：桌面可比對　代價：手機順序較複雜</text><rect x="40" y="830" width="580" height="328" rx="8" fill="#fff" stroke="#dbe7df"/><text x="60" y="864" font-size="21" fill="#182e27">03 A 側邊導覽 / 工作區固定</text><rect x="60" y="882" width="540" height="32" rx="3" fill="#eaf0e6" stroke="#dbe7df"/><text x="72" y="905" font-size="14" fill="#182e27">品牌與導覽                                      主要入口</text><rect x="60" y="926" width="128" height="164" rx="8" fill="#eaf0e6" stroke="#dbe7df"/><text x="75" y="959" font-size="17" fill="#182e27">營運首頁</text><text x="75" y="996" font-size="17" fill="#182e27">預約與回診</text><text x="75" y="1033" font-size="17" fill="#182e27">營業時間</text><text x="212" y="954" font-size="22" fill="#182e27">週曆與櫃台佇列</text><rect x="212" y="973" width="368" height="28" rx="3" fill="#f8f7f2" stroke="#dbe7df"/><rect x="212" y="1009" width="368" height="28" rx="3" fill="#f8f7f2" stroke="#dbe7df"/><rect x="212" y="1045" width="368" height="28" rx="3" fill="#f8f7f2" stroke="#dbe7df"/><text x="70" y="1120" font-size="16" fill="#182e27">優點：位置穩定　代價：桌面內容寬度減少</text><rect x="660" y="830" width="580" height="328" rx="8" fill="#fff" stroke="#dbe7df"/><text x="680" y="864" font-size="21" fill="#182e27">03 B 指令首頁 / 搜尋優先</text><rect x="680" y="882" width="540" height="32" rx="3" fill="#eaf0e6" stroke="#dbe7df"/><text x="692" y="905" font-size="14" fill="#182e27">品牌與導覽                                      主要入口</text><rect x="690" y="934" width="510" height="43" rx="8" fill="#f8f7f2" stroke="#dbe7df"/><text x="708" y="962" font-size="20" fill="#182e27">搜尋預約 / 進入工作區</text><rect x="690" y="998" width="160" height="80" rx="8" fill="#eaf0e6" stroke="#dbe7df"/><text x="721" y="1043" font-size="19" fill="#182e27">待處理</text><rect x="864" y="998" width="160" height="80" rx="8" fill="#eaf0e6" stroke="#dbe7df"/><text x="895" y="1043" font-size="19" fill="#182e27">今日預約</text><rect x="1038" y="998" width="160" height="80" rx="8" fill="#eaf0e6" stroke="#dbe7df"/><text x="1069" y="1043" font-size="19" fill="#182e27">新預約</text><text x="690" y="1120" font-size="16" fill="#182e27">優點：單次任務快　代價：需重排既有工作區</text><text x="40" y="1210" font-size="15">色彩、內容與排列為方案比較；正式 UI 與行為以打包產物、規則書及測試為準。</text></g></svg>