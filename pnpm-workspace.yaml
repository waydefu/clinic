packages:
  - apps/*
  - packages/*
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  re2: false

# pnpm 11.9 supply-chain maturity gate. 3.1.7 / 4.1.4 are the 2026-09-02
# security patches (GHSA-58mr-gqgx-xq4g, GHSA-qw65-cvwx-89v3). They are
# younger than the default release-age window, so they must be named here
# or the resolver will refuse them. This is not an audit exception and does
# not change audit:prod / audit:all thresholds.
minimumReleaseAgeExclude:
  - fast-uri@3.1.7 || 4.1.4

# 安全性修補：把有 advisory 的傳遞相依鎖到已修補的版本。
#
# 兩筆都是**同一個 major 內的 patch**，所以不會改變任何 API；上游把版本帶上來
# 之後這裡就可以刪掉。`pnpm audit --audit-level high` 是 check:supply-chain 的
# 一部分，CI 會擋，所以修補要留在版控裡而不是靠本機安裝的時機。
#
#   find-my-way    <=9.6.0  HTTP/2 DDoS（GHSA 見 advisory）
#                  路徑：apps/api > @nestjs/platform-fastify > fastify
#   brace-expansion 不受限展開導致 OOM（GHSA-mh99-v99m-4gvg）
#                  路徑：eslint > minimatch（dev-only）、firebase-admin／
#                  firebase-tools > … > glob > minimatch
#                  2026-07-31 advisory 修訂後，舊 major 各自有了修補版，因此改為
#                  逐 major 鎖定而不是只鎖 5.x：minimatch@3 要 ^1、minimatch@5／6
#                  要 ^2，跨 major 硬鎖會壞掉。
#   uuid           <11.1.1
#                  路徑：apps/api、apps/worker > firebase-admin >
#                  @google-cloud/storage > gaxios／teeny-request > uuid
#                  **這是四筆 moderate 裡唯一進到出貨程式的**——另外三筆只經由
#                  firebase-tools（CLI）。同 major 內的 patch，鎖了不改任何 API。
#   @opentelemetry/core <2.8.0  baggage propagation 可能不受限配置記憶體
#                  路徑：firebase-tools > @google-cloud/pubsub（dev-only）
#                  Pub/Sub 5.3.1 只匯入 v2 保留的 W3CTraceContextPropagator；
#                  精確鎖到第一個修補版，直到上游放寬目前的 ^1.30.1。
#   tar            <=7.5.20 archive member selection 可觸發 stack overflow
#                  所有路徑原本就接受 7.x patch，精確鎖到目前修補版 7.5.22。
#   @hono/node-server <2.0.5 Windows encoded-backslash path traversal
#                  先帶入已正式放寬 v2 range 的 MCP SDK 1.30.0，再鎖 Hono 2.0.12。
#   fast-uri       host confusion / SSRF（多筆 high GHSA）
#                  路徑：apps/api > @nestjs/platform-fastify > fastify，**出貨面**。
#                  3.x：@fastify/ajv-compiler ^3.0.0、ajv ^3.0.1。
#                  4.x：fast-json-stringify ^4.0.0。樹上沒有 2.x。
#                  2026-08-04 鎖到 ^3.1.5 / ^4.1.2。2026-09-03 在未改 lockfile 下
#                  audit:prod 對 3.1.5 / 4.1.2 回報 8 high（GHSA-5jgf-p345-68v8、
#                  GHSA-f65p-4m7j-42xc、GHSA-fph4-wmhf-6fwf、GHSA-jqff-g426-hqxp；
#                  每筆分 3.x／4.x）。父套件 range 已允許修補版；失敗原因是
#                  lockfile 仍解析到舊 patch。pnpm 審計可見的 patched 下限是
#                  3.1.6 / 4.1.3，但 GitHub 2026-09-02 的 GHSA-58mr-gqgx-xq4g 與
#                  GHSA-qw65-cvwx-89v3 的 affected 恰為 3.1.6 / 4.1.3，修補版是
#                  3.1.7 / 4.1.4。因此地板升到 ^3.1.7 與 ^4.1.4，仍是同 major
#                  patch。不可用無範圍的 `fast-uri: ^3.1.7`——那會把 4.x 降級。
#   fastify        schema 根層 primitive coercion 繞過（GHSA-w2qp-rph6-63g4，
#                  moderate）與 trustProxy hop-count 偽造（GHSA-3m5p-2c4r-xxw2，
#                  moderate）。路徑：apps/api > @nestjs/platform-fastify >
#                  fastify，**出貨面**。@nestjs/platform-fastify@11.1.28 精確釘
#                  fastify 5.10.0；11.x 最新 11.2.3 仍精確釘 5.11.3，都 <5.12.1。
#                  Nest 12.0.1 才帶 5.12.1，屬 framework 跨 major，不做。因此
#                  比照 find-my-way，用無 selector 的 `fastify: '^5.12.1'`——
#                  `fastify@^5` 對精確釘 5.10.0 可能套不上。樹上只有 5.x；
#                  不得改成 6.x。
#
# 以下三筆是 2026-08-04 修掉 fast-uri 之後才浮現的：`check:supply-chain` 依序跑
# audit:prod 再跑 audit:all，出貨面先失敗時 audit:all 根本沒機會執行，所以這三筆
# dev 鏈的 high 一直被遮住。全部只經由 firebase-tools（CLI）與 eslint，不出貨。
#
#   undici         >=8.0.0 <8.9.0  degenerate private cache directive 造成跨使用者
#                  資訊洩漏與 parse-time crash（GHSA-4cwx-7wf7-3272）
#                  路徑：firebase-tools > superstatic > re2 > node-gyp > undici
#                  樹上另有 undici@6.27.0，不在漏洞範圍，因此鎖 ^8 那一條線。
#   ip-address     <=10.3.0  Address4 把前導零位元組當十進位解析，但 resolver 當
#                  八進位，造成 SSRF 與信任邊界繞過（GHSA-mwp4-54f8-5fhr）
#                  路徑：firebase-tools > @modelcontextprotocol/sdk >
#                  express-rate-limit > ip-address，以及 > proxy-agent > socks
#   brace-expansion >=4.0.0 <5.0.9  以不受限的中間陣列繞過 CVE-2026-14257 的緩解
#                  （GHSA-rgw5-rvv9-x895）。**這是既有 ^5 override 的續修**——
#                  原本鎖 ^5.0.8 已不足，改鎖 ^5.0.9。1.x／2.x 不在此次範圍內。
overrides:
  find-my-way: '^9.6.1'
  brace-expansion@^1: '^1.1.17'
  brace-expansion@^2: '^2.1.3'
  brace-expansion@^5: '^5.0.9'
  uuid: '>=11.1.1'
  '@opentelemetry/core': '2.8.0'
  tar@^7: '7.5.22'
  '@modelcontextprotocol/sdk': '1.30.0'
  '@hono/node-server': '2.0.12'
  fast-uri@^3: '^3.1.7'
  fast-uri@^4: '^4.1.4'
  fastify: '^5.12.1'
  undici@^8: '^8.9.0'
  ip-address@^10: '^10.3.1'

# 2026-08-01：本檔曾經有一筆 `auditConfig.ignoreGhsas` 例外
# （GHSA-mh99-v99m-4gvg，SEC-03）。當時的解除條件寫的是「1.x／2.x 出現修補版」，
# 而 advisory 在 2026-07-31T19:37Z 修訂後補上了各 major 的 patched 版本
# （1.1.17／2.1.3／3.0.3／5.0.8）。條件既已成立，就把它修掉而不是續期——
# **例外的正確結局是被移除，不是被延長**。目前沒有任何 audit 例外。
#
# 閘門分兩層（2026-07-26 決定，`check:supply-chain` 依序跑兩個指令）：
#
#   audit:prod  `--prod --audit-level moderate`  出貨面，**moderate 就擋**
#   audit:all   `--audit-level high`             含 dev 工具鏈，high 才擋
#
# 為什麼不是單一門檻：把全部拉到 moderate，會被 firebase-tools（CLI，不出貨）
# 的傳遞相依長期壓在紅燈，最後一定演變成整條 audit 被關掉或被 ignore 洗到失效；
# 維持單一 high 則相反——**出貨程式**多一筆 moderate 也不會有人發現。分成兩層
# 之後，「哪一種漏洞會擋下發布」是一個寫在指令裡、可被檢驗的決定，而不是慣例。
#
# 2026-07-31 修補以下三筆 firebase-tools CLI 傳遞相依：
#
#   @hono/node-server：@modelcontextprotocol/sdk 1.30.0 的正式 range 已放寬到
#                      ^1.19.9 || ^2.0.5，因此可安全解析到 2.0.12。
#   tar：firebase-tools 與 node-gyp 的既有 ^7 range 解析到 7.5.22。
#   @opentelemetry/core：上游 @google-cloud/pubsub 5.3.1 尚限 ^1.30.1；先以上方
#                        精確 override 使用第一個修補版 2.8.0。該父套件只使用
#                        v2 仍公開的 W3CTraceContextPropagator。
#
# **解除條件**：各父套件的正常 range 已直接解析到上述安全版本後，逐條刪除
# override，重建 lockfile 並重跑 supply-chain／Emulator gates。
