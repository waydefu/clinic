packages:
  - apps/*
  - packages/*
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  re2: false

# 安全性修補：把有 advisory 的傳遞相依鎖到已修補的版本。
#
# 兩筆都是**同一個 major 內的 patch**，所以不會改變任何 API；上游把版本帶上來
# 之後這裡就可以刪掉。`pnpm audit --audit-level high` 是 check:supply-chain 的
# 一部分，CI 會擋，所以修補要留在版控裡而不是靠本機安裝的時機。
#
#   find-my-way    <=9.6.0  HTTP/2 DDoS（GHSA 見 advisory）
#                  路徑：apps/api > @nestjs/platform-fastify > fastify
#   brace-expansion 不受限展開導致 OOM（GHSA-mh99-v99m-4gvg）
#                  路徑：eslint > minimatch（dev-only）、firebase-admin／
#                  firebase-tools > … > glob > minimatch
#                  2026-07-31 advisory 修訂後，舊 major 各自有了修補版，因此改為
#                  逐 major 鎖定而不是只鎖 5.x：minimatch@3 要 ^1、minimatch@5／6
#                  要 ^2，跨 major 硬鎖會壞掉。
#   uuid           <11.1.1
#                  路徑：apps/api、apps/worker > firebase-admin >
#                  @google-cloud/storage > gaxios／teeny-request > uuid
#                  **這是四筆 moderate 裡唯一進到出貨程式的**——另外三筆只經由
#                  firebase-tools（CLI）。同 major 內的 patch，鎖了不改任何 API。
#   @opentelemetry/core <2.8.0  baggage propagation 可能不受限配置記憶體
#                  路徑：firebase-tools > @google-cloud/pubsub（dev-only）
#                  Pub/Sub 5.3.1 只匯入 v2 保留的 W3CTraceContextPropagator；
#                  精確鎖到第一個修補版，直到上游放寬目前的 ^1.30.1。
#   tar            <=7.5.20 archive member selection 可觸發 stack overflow
#                  所有路徑原本就接受 7.x patch，精確鎖到目前修補版 7.5.22。
#   @hono/node-server <2.0.5 Windows encoded-backslash path traversal
#                  先帶入已正式放寬 v2 range 的 MCP SDK 1.30.0，再鎖 Hono 2.0.12。
overrides:
  find-my-way: '^9.6.1'
  brace-expansion@^1: '^1.1.17'
  brace-expansion@^2: '^2.1.3'
  brace-expansion@^5: '^5.0.8'
  uuid: '>=11.1.1'
  '@opentelemetry/core': '2.8.0'
  tar@^7: '7.5.22'
  '@modelcontextprotocol/sdk': '1.30.0'
  '@hono/node-server': '2.0.12'

# 2026-08-01：本檔曾經有一筆 `auditConfig.ignoreGhsas` 例外
# （GHSA-mh99-v99m-4gvg，SEC-03）。當時的解除條件寫的是「1.x／2.x 出現修補版」，
# 而 advisory 在 2026-07-31T19:37Z 修訂後補上了各 major 的 patched 版本
# （1.1.17／2.1.3／3.0.3／5.0.8）。條件既已成立，就把它修掉而不是續期——
# **例外的正確結局是被移除，不是被延長**。目前沒有任何 audit 例外。
#
# 閘門分兩層（2026-07-26 決定，`check:supply-chain` 依序跑兩個指令）：
#
#   audit:prod  `--prod --audit-level moderate`  出貨面，**moderate 就擋**
#   audit:all   `--audit-level high`             含 dev 工具鏈，high 才擋
#
# 為什麼不是單一門檻：把全部拉到 moderate，會被 firebase-tools（CLI，不出貨）
# 的傳遞相依長期壓在紅燈，最後一定演變成整條 audit 被關掉或被 ignore 洗到失效；
# 維持單一 high 則相反——**出貨程式**多一筆 moderate 也不會有人發現。分成兩層
# 之後，「哪一種漏洞會擋下發布」是一個寫在指令裡、可被檢驗的決定，而不是慣例。
#
# 2026-07-31 修補以下三筆 firebase-tools CLI 傳遞相依：
#
#   @hono/node-server：@modelcontextprotocol/sdk 1.30.0 的正式 range 已放寬到
#                      ^1.19.9 || ^2.0.5，因此可安全解析到 2.0.12。
#   tar：firebase-tools 與 node-gyp 的既有 ^7 range 解析到 7.5.22。
#   @opentelemetry/core：上游 @google-cloud/pubsub 5.3.1 尚限 ^1.30.1；先以上方
#                        精確 override 使用第一個修補版 2.8.0。該父套件只使用
#                        v2 仍公開的 W3CTraceContextPropagator。
#
# **解除條件**：各父套件的正常 range 已直接解析到上述安全版本後，逐條刪除
# override，重建 lockfile 並重跑 supply-chain／Emulator gates。
