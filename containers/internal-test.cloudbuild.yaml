steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - containers/api.Dockerfile
      - --build-arg
      - SOURCE_SHA=${_SOURCE_SHA}
      - --tag
      - asia-east1-docker.pkg.dev/$PROJECT_ID/internal-test/api:${_SOURCE_SHA}
      - .
    waitFor: ['-']
  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - containers/internal-test-outbox.Dockerfile
      - --build-arg
      - SOURCE_SHA=${_SOURCE_SHA}
      - --tag
      - asia-east1-docker.pkg.dev/$PROJECT_ID/internal-test/worker:${_SOURCE_SHA}
      - .
    waitFor: ['-']
# C1 cost bound: cap the combined job at 10 minutes. No machine type override,
# so the default pool runs it on the default e2-standard-2 worker.
timeout: 600s
images:
  - asia-east1-docker.pkg.dev/$PROJECT_ID/internal-test/api:${_SOURCE_SHA}
  - asia-east1-docker.pkg.dev/$PROJECT_ID/internal-test/worker:${_SOURCE_SHA}
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _SOURCE_SHA: unset
