<!doctype html>
<html lang="zh-Hant" data-theme="warm">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#155c48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>找不到頁面｜一森渼診所</title>
    <!-- 錯誤頁維持獨立樣式表與零 script budget；static data-theme 讓這個 utility
         surface 使用護眼暖色，不複製主應用的切換邏輯。 -->
    <link rel="stylesheet" href="/error.css" />
  </head>
  <body class="error-body">
    <main class="error-card" id="error-main">
      <p class="error-brand">一森渼診所</p>
      <p class="error-code" aria-hidden="true">404</p>
      <h1 class="error-title">找不到這個頁面</h1>
      <p class="error-lead">
        您要找的頁面可能已移動或不存在。您可以回到首頁，或直接前往線上預約。
      </p>
      <div class="error-actions">
        <a class="error-button error-button-primary" href="/booking"
          >前往線上預約</a
        >
        <a class="error-button" href="/">回到首頁</a>
      </div>
      <p class="error-contact">
        需要協助嗎？請來電
        <a href="tel:+886225771314">02-2577-1314</a>
        或免付費專線
        <a href="tel:+886800000913">0800-000-913</a>
        由專人為您安排。
      </p>
    </main>
  </body>
</html>
