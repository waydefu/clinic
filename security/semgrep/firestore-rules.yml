rules:
  - id: clinic.firestore.unconditional-access
    message: >-
      Firestore access must deny by default and use an explicit authorization
      predicate; an unconditional true rule exposes clinic data.
    severity: ERROR
    languages: [generic]
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-284: Improper Access Control'
      coverage: firestore-authorization
      source: repository-owned
    paths:
      include:
        - '*.rules'
    pattern-regex: >-
      (?m)^\s*allow\s+(?:read|write|get|list|create|update|delete)(?:\s*,\s*(?:read|write|get|list|create|update|delete))*\s*:\s*if\s+(?:\(\s*)*(?:true(?:\s*(?:&&|==|\|\|)\s*true)?|false\s*(?:==\s*false|\|\|\s*true)|true\s*\|\|\s*false|!\s*(?:\(\s*)*false(?:\s*\))*|1\s*==\s*1|request\.auth\s*!=\s*null\s*\|\|\s*true|true\s*\|\|\s*request\.auth\s*!=\s*null)(?:\s*\))*\s*;
