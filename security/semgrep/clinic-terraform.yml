rules:
  - id: clinic.terraform.literal-runtime-image-without-digest
    languages: [hcl]
    severity: ERROR
    message: >-
      Literal Cloud Run runtime image references must use an immutable SHA-256
      digest. Dynamic references remain subject to Terraform validation and the
      source-bound runtime packet; this rule does not prove their resolved value.
    metadata:
      category: security
      technology: [terraform, google-cloud-run]
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
    patterns:
      - pattern-inside: |
          resource "google_cloud_run_v2_service" $NAME {
            ...
          }
      - pattern: |
          containers {
            ...
            image = "$IMAGE"
            ...
          }
      - metavariable-regex:
          metavariable: $IMAGE
          regex: '^(?!.*@sha256:[a-f0-9]{64}$).+$'
